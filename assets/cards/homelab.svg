<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <title id="t">Homelab: GitHub and Argo CD deploy to k3s on an OVH VPS, provisioned by OpenTofu, rebuilt from Git. Written with an AI agent, reviewed by me.</title>
  <defs>
    <clipPath id="card"><rect width="480" height="300" rx="14"/></clipPath>
    <clipPath id="vis"><rect width="480" height="200"/></clipPath>
    <pattern id="bggrid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#9fd8ff" stroke-opacity=".06"/></pattern>
  </defs>
  <style>
    .ti{font:400 36px Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif;letter-spacing:2px}
    .tg{font:600 19px ui-monospace,'Cascadia Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace}
    .ch{font:700 12px ui-monospace,'Cascadia Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace;letter-spacing:1px}
    .bx{fill:#161b22;stroke:#30363d;stroke-width:1.5}
    .k3s{fill:#0d1d33;stroke:#58a6ff;stroke-width:1.5;animation:k3s 3s ease-in-out infinite}
    @keyframes k3s{50%{stroke:#a5d6ff}}
    .bt{font:700 17px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .bs{font:12.5px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#8b949e}
    .cp{fill:#161b22;stroke:#30363d;stroke-width:1.5;animation:cp 1.8s ease-in-out infinite}
    @keyframes cp{0%,60%,100%{stroke:#30363d}30%{stroke:#58a6ff}}
    .cpt{font:13.5px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .fl{fill:none;stroke:#58a6ff;stroke-width:2.5;stroke-dasharray:6 5;animation:flow .9s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-11}}
    .ah{fill:#58a6ff}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#card)">
    <rect width="480" height="300" fill="#0d1117"/>
    <g clip-path="url(#vis)"><rect width="480" height="200" fill="url(#bggrid)"/>
    <rect class="bx" x="24" y="46" width="120" height="56" rx="7"/><text x="84.0" y="72.0" text-anchor="middle" class="bt">GitHub</text><text x="84.0" y="89.0" text-anchor="middle" class="bs">repo + SOPS</text>
    <rect class="bx" x="174" y="46" width="120" height="56" rx="7"/><text x="234.0" y="72.0" text-anchor="middle" class="bt">Argo CD</text><text x="234.0" y="89.0" text-anchor="middle" class="bs">app of apps</text>
    <rect class="bx" x="24" y="130" width="120" height="56" rx="7"/><text x="84.0" y="156.0" text-anchor="middle" class="bt">OpenTofu</text><text x="84.0" y="173.0" text-anchor="middle" class="bs">VPS + DNS</text>
    <rect class="k3s" x="318" y="50" width="142" height="144" rx="10"/>
    <text x="389" y="72" text-anchor="middle" class="bt">k3s</text>
    <text x="389" y="88" text-anchor="middle" class="bs">OVH VPS</text>
    <rect class="cp" x="330" y="96" width="118" height="26" rx="6" style="animation-delay:0s"/><text x="389" y="114" text-anchor="middle" class="cpt">Traefik</text><rect class="cp" x="330" y="128" width="118" height="26" rx="6" style="animation-delay:0.6s"/><text x="389" y="146" text-anchor="middle" class="cpt">cert-manager</text><rect class="cp" x="330" y="160" width="118" height="26" rx="6" style="animation-delay:1.2s"/><text x="389" y="178" text-anchor="middle" class="cpt">Authelia</text>
    <path class="fl" d="M144 74H168"/><path class="fl" d="M294 74H312"/><path class="fl" d="M144 158H312"/>
    <path class="ah" d="M168 69l7 5-7 5z"/><path class="ah" d="M312 69l7 5-7 5z"/><path class="ah" d="M312 153l7 5-7 5z"/>
    <text x="228" y="150" text-anchor="middle" class="bs">provisions</text></g>
    
    <rect y="200" width="480" height="2" fill="#f0883e"/>
    <text x="24" y="248" class="ti" fill="#e6edf3">HOMELAB</text>
    <text x="24" y="280" class="tg" fill="#f0883e">k3s on OVH, rebuilt from Git</text>
    <g transform="translate(356 16)">
      <rect width="108" height="24" rx="12" fill="#0d1117" fill-opacity=".8" stroke="#79c0ff" stroke-width="1.5"/>
      <text x="54.0" y="16.5" text-anchor="middle" class="ch" fill="#79c0ff">AI-ASSISTED</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="478.5" height="298.5" rx="13.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
