<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 0 768 360" width="768" height="360" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>Homelab: GitHub and Argo CD deploy to k3s on an OVH VPS, provisioned by OpenTofu</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="640" height="360" rx="16" fill="#0d1117"/>

  <!-- GitHub -->
  <rect x="28" y="56" width="176" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="116" y="96" text-anchor="middle" font-size="28" font-weight="700" fill="#e6edf3">GitHub</text>
  <text x="116" y="126" text-anchor="middle" font-size="22" fill="#8b949e">repo + SOPS</text>

  <!-- Argo CD -->
  <rect x="236" y="56" width="164" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="318" y="96" text-anchor="middle" font-size="28" font-weight="700" fill="#e6edf3">Argo CD</text>
  <text x="318" y="126" text-anchor="middle" font-size="22" fill="#8b949e">app of apps</text>

  <!-- OpenTofu -->
  <rect x="28" y="216" width="176" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="116" y="256" text-anchor="middle" font-size="28" font-weight="700" fill="#e6edf3">OpenTofu</text>
  <text x="116" y="286" text-anchor="middle" font-size="22" fill="#8b949e">VPS + DNS</text>

  <!-- k3s on the OVH VPS -->
  <rect x="436" y="28" width="184" height="304" rx="12" fill="#0d1d33" stroke="#58a6ff" stroke-width="2"/>
  <text x="528" y="72" text-anchor="middle" font-size="28" font-weight="700" fill="#e6edf3">k3s</text>
  <text x="528" y="100" text-anchor="middle" font-size="22" fill="#8b949e">OVH VPS</text>
  <rect x="450" y="124" width="156" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="528" y="157" text-anchor="middle" font-size="22" fill="#e6edf3">Traefik</text>
  <rect x="450" y="190" width="156" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="528" y="223" text-anchor="middle" font-size="22" fill="#e6edf3">cert-manager</text>
  <rect x="450" y="256" width="156" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="528" y="289" text-anchor="middle" font-size="22" fill="#e6edf3">Authelia</text>

  <!-- Arrows -->
  <line x1="204" y1="100" x2="232" y2="100" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="400" y1="100" x2="432" y2="100" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="204" y1="260" x2="432" y2="260" stroke="#58a6ff" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="318" y="246" text-anchor="middle" font-size="22" fill="#8b949e">provisions</text>
</svg>
